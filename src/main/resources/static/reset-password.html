<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password - Post Office Agent System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-wrap">
    <form id="reset-form" class="card login-card" autocomplete="off">
        <h1>Reset password</h1>
        <p class="muted">Choose a new password for your account.</p>
        <label>New password <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <label>Confirm password <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <button id="submit-btn" class="btn primary" type="submit">Reset password</button>
        <p id="message" role="status" aria-live="polite" hidden></p>
        <p><a href="/index.html">Back to login</a></p>
    </form>
</main>
<script src="js/reset-password.js"></script>
</body>
</html>
