<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password - Post Office Agent System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-wrap">
    <form id="forgot-form" class="card login-card" autocomplete="on">
        <h1>Forgot password</h1>
        <p class="muted">Enter your username and the recovery email registered to your account. If they match an active account, we will send a reset link.</p>
        <label>Username <input id="username" name="username" autocomplete="username" maxlength="50" required></label>
        <label>Recovery email <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <button id="submit-btn" class="btn primary" type="submit">Send reset link</button>
        <p id="message" role="status" aria-live="polite" hidden></p>
        <p><a href="/index.html">Back to login</a></p>
    </form>
</main>
<script src="js/forget-password.js"></script>
</body>
</html>
