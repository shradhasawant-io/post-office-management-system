<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post Office Agent Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login-view" class="login-wrap">
    <form id="login-form" class="card login-card" autocomplete="off">
        <h1>📮 Post Office Agent System</h1>
        <p class="muted">Sign in to continue</p>

        <label>Role
            <select id="login-role">
                <option value="AGENT">Agent</option>
                <option value="ADMIN">Admin</option>
            </select>
        </label>
        <label>Username <input id="login-user" required></label>
        <label>Password <input id="login-pass" type="password" required></label>

        <button class="btn primary" type="submit">Login</button>
        <p id="login-error" class="error" hidden></p>

        <hr>
        <button type="button" id="first-admin-btn" class="btn link">Create first admin</button>
    </form>
</section>

<!-- ================= APP SHELL ================= -->
<div id="app-view" class="app" hidden>
    <aside class="sidebar">
        <div class="brand">📮 Post Office</div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
            <div id="who" class="muted"></div>
            <button id="logout-btn" class="btn">Logout</button>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <h2 id="view-title"></h2>
            <div id="view-actions"></div>
        </header>
        <div id="view-body"></div>
    </main>
</div>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal" hidden>
    <div class="modal-box card">
        <h3 id="modal-title"></h3>
        <form id="modal-form"></form>
        <p id="modal-error" class="error" hidden></p>
        <div class="modal-actions">
            <button type="button" id="modal-cancel" class="btn">Cancel</button>
            <button type="submit" form="modal-form" class="btn primary">Save</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
